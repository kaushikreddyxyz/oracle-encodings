[project]
name = "oracle-encodings"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "contourpy>=1.3.3",
    "cycler>=0.12.1",
    "einops>=0.8.2",
    "fonttools>=4.63.0",
    "hf>=1.17.0",
    "httpx>=0.28.1",
    "ipykernel>=7.2.0",
    "ipython>=9.13.0",
    "kaleido>=1.3.0",
    "matplotlib>=3.10.9",
    "nbformat>=5.10.4",
    "neuronpedia>=1.2.0",
    "nnsight>=0.7.0",
    "numpy>=2.4.6",
    "pandas>=3.0.3",
    "pillow>=12.2.0",
    "plotly>=6.7.0",
    "pyparsing>=3.3.2",
    "python-dotenv>=1.0.1",
    "ruff>=0.15.15",
    "torch>=2.9.1",
    "tqdm>=4.67.3",
    "transformer-lens>=3.3.0",
    "transformers>=5.10.1",
    "ty>=0.0.43",
    "wandb>=0.18.0",
]

# torch must match the host NVIDIA driver's CUDA capability (12.8). The default
# PyPI wheel for torch 2.12 is +cu130 (CUDA 13.0), which fails to init on this
# driver. Pin torch to PyTorch's cu128 index, whose newest build is 2.9.1.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["modular_addition"]
